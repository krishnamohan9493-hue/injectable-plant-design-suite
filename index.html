/* ---- DEAD-LEG ---- */
function deadlegRows(){
  const Tamb = S.p.amb;
  return S.deadleg.map((b,i)=>{
    const LD = b.D>0 ? b.L/b.D : 999;
    let verdict, verdictCls;
    if(LD <= 1.5){ verdict='PASS (≤ 1.5D)'; verdictCls='dl-pass'; }
    else if(LD <= 2){ verdict='WARN (1.5D – 2D)'; verdictCls='dl-warn'; }
    else { verdict='FAIL (> 2D)'; verdictCls='dl-fail'; }
    const Di = b.D/1000, t_wall = 0.0015, Do = Di + 2*t_wall;
    const k_ss = 15, k_ins = 0.04, ins_th = (b.ins||0)/1000;
    const L_m = b.L/1000;
    const Ri = 1/(Math.PI*Di*50);
    const Rpipe = Math.log(Do/Di)/(2*Math.PI*k_ss);
    const Rins = ins_th>0 ? Math.log((Do+2*ins_th)/Do)/(2*Math.PI*k_ins) : Math.log((Do+0.01)/Do)/(2*Math.PI*0.04);
    const Ro = 1/(Math.PI*(Do+2*Math.max(ins_th,0.005))*10);
    const U_L = 1/(Ri+Rpipe+Rins+Ro);
    const V_vol = Math.PI/4*Di*Di*L_m;
    const m_w = V_vol*1000;
    const tau = m_w*4186/U_L;
    const T_threshold = 60;
    const T_diff = b.Tloop - Tamb;
    let t_cool = Infinity;
    if(T_diff > 0 && T_threshold > Tamb){
      const ratio = (T_threshold - Tamb)/T_diff;
      if(ratio > 0 && ratio < 1) t_cool = -tau * Math.log(ratio);
    }
    const t_cool_min = isFinite(t_cool) ? t_cool/60 : null;
    const t_flush = L_m/1;
    let biofilmRisk;
    if(b.fluid === 'WFI' || b.fluid === 'PW' || b.fluid === 'CS'){
      if(LD > 2 && b.Tloop < 65) biofilmRisk = 'HIGH';
      else if(LD > 1.5) biofilmRisk = 'MEDIUM';
      else biofilmRisk = 'LOW';
    } else biofilmRisk = 'N/A';
    return {...b, LD, verdict, verdictCls, t_cool_min, t_flush, biofilmRisk, i};
  });
}

/* ---- EXPRESSION PARSER ---- */
function ev(src,vars){
  let i=0;const s=src.replace(/\s+/g,'');
  const F={sqrt:Math.sqrt,ln:Math.log,log:Math.log10,log10:Math.log10,sin:Math.sin,cos:Math.cos,tan:Math.tan,asin:Math.asin,acos:Math.acos,atan:Math.atan,atan2:Math.atan2,abs:Math.abs,min:Math.min,max:Math.max,ceil:Math.ceil,floor:Math.floor,round:Math.round,exp:Math.exp,pow:Math.pow,pi:Math.PI,E:Math.E};
  const ex=()=>{let a=tm();while(s[i]=='+'||s[i]=='-'){const o=s[i++],b=tm();a=o=='+'?a+b:a-b}return a};
  const tm=()=>{let a=pw();while(s[i]=='*'||s[i]=='/'){const o=s[i++],b=pw();a=o=='*'?a*b:a/b}return a};
  const pw=()=>{const a=un();if(s[i]=='^'){i++;return Math.pow(a,pw())}return a};
  const un=()=>s[i]=='-'?(i++,-un()):s[i]=='+'?(i++,un()):at();
  function at(){
    if(s[i]=='('){i++;const a=ex();if(s[i++]!=')')throw'missing )';return a}
    const m=/^(\d+\.?\d*(?:e[+-]?\d+)?|\.\d+|[a-zA-Z_]\w*)/i.exec(s.slice(i));
    if(!m)throw'unexpected '+(s[i]||'end');i+=m[0].length;const t=m[0];
    if(/^[\d.]/.test(t))return +t;
    if(s[i]=='('){i++;const a=[];if(s[i]!=')'){a.push(ex());while(s[i]==','){i++;a.push(ex())}}if(s[i++]!=')')throw'missing )';if(!F[t])throw'unknown function '+t;return F[t](...a)}
    if(t=='pi'||t=='PI')return Math.PI;if(t=='e'||t=='E')return Math.E;if(t in vars)return vars[t];throw'unknown variable '+t;
  }
  const r=ex();if(i<s.length)throw'unexpected '+s[i];return r;
}

<section class="c"><h2>Audit trail</h2><div class="sc"><table><tr><th>Time</th><th>Scope</th><th>Field</th><th>Old</th><th>New</th></tr>${S.aud.slice(0,60).map(a=>`<tr><td>${a.t}</td><td>${esc(a.s)}</td><td>${esc(a.k)}</td><td>${esc(a.o)}</td><td>${esc(a.n)}</td></tr>`).join('')||'<tr><td colspan="5" class="mu">No changes yet.</td></tr>'}</table></div></section>`}

/* ---- RENDER ---- */
function render(){
  compute();
  $('#ttl').textContent=S.p.name||'Injectable Plant Design Suite';
  $('#sub').textContent=`${S.p.doc} · Rev ${S.p.rev} · ${S.p.loc}`;
  $('#nav').innerHTML=TABS.map(t=>`<button data-tab="${t[0]}"${t[0]==tab&&!all?' class="on"':''}>${t[1]}</button>`).join('');
  const printHeader = `<div class="print-header"><h2>${esc(S.p.name)} – Electrical Calculation Book</h2><p>Document: ${esc(S.p.doc)} | Rev: ${esc(S.p.rev)} | Location: ${esc(S.p.loc)}<br>Prepared by: ${esc(S.p.by)} | Print Date: ${new Date().toLocaleDateString()}</p></div>`;
  let body;
  if(all){
    body = printHeader + `<section class="c"><h2>${esc(S.p.name)} – calculation book</h2></section>`+loadsView()+ORD.map(card).join('')+sldView()+deadlegView()+coldView()+pipeView()+estView()+schView()+fdaView()+regView()+scopeView()+indView();
  } else if(tab=='dash'){ body=dash(); }
  else if(tab=='loads'){ body=loadsView(); }
  else if(tab=='cust'){ body=custView(); }
  else if(tab=='sld'){ body=sldView(); }
  else if(tab=='deadleg'){ body=deadlegView(); }
  else if(tab=='cold'){ body=coldView(); }
  else if(tab=='pipe'){ body=pipeView(); }
  else if(tab=='est'){ body=estView(); }
  else if(tab=='sch'){ body=schView(); }
  else if(tab=='fda'){ body=fdaView(); }
  else if(tab=='reg'){ body=regView(); }
  else if(tab=='scope'){ body=scopeView(); }
  else if(tab=='ind'){ body=indView(); }
  else { body=card(tab); }
  $('#m').innerHTML = body;
}

/* ---- EVENT LISTENERS ---- */
document.addEventListener('change',e=>{const t=e.target,d=t.dataset;let v=t.type=='number'?+t.value:t.value;
if(d.k){const sc=d.s,o=gv(sc,d.k,'');if(d.n=='1')v=+t.value;if(sc=='p')S.p[d.k]=v;else(S.v[sc]=S.v[sc]||{})[d.k]=v;log(sc,d.k,o,v)}
else if(d.ld!==undefined){const l=S.loads[d.ld];log('loads',d.c+'#'+(+d.ld+1),l[d.c],v);l[d.c]=v}
else if(d.cc!==undefined){const c=S.cust[d.cc];if(d.v)c.v[d.v]=v;else c.e=t.value;log('custom',c.n,'',t.value)}
else if(d.dl!==undefined){const b=S.deadleg[d.dl];const o=b[d.c];b[d.c]=d.c==='n'||d.c==='fluid'?v:+v;log('deadleg',d.c+'#'+(+d.dl+1),o,b[d.c])}
else if(d.co!==undefined){const b=S.cold[d.co];const o=b[d.c];b[d.c]=d.c==='n'?v:+v;log('cold',d.c+'#'+(+d.co+1),o,b[d.c])}
else if(d.pi!==undefined){S.pipe[d.pi][d.c]=v;log('pipe',d.c,'',v)}
else if(d.eq!==undefined){S.est[d.c]=S.est[d.c]||{};S.est[d.c][d.eq]=v;log('est',d.eq+' '+d.c,'',v)}
else if(d.sc!==undefined){S.sch.acts[d.sc][d.c]=v;log('sch',d.c,'',v)}
else if(d.sk){S.sch.start=v;log('sch','start','',v)}
else if(d.rg!==undefined){S.reg[d.rg]=S.reg[d.rg]||{};S.reg[d.rg][d.c]=t.value;log('compliance',REG[d.rg][0],'',t.value)}
else if(d.fda){
  const scope = d.fda;
  const id = d.id;
  S.fda[scope] = S.fda[scope] || {};
  S.fda[scope][id] = t.checked;
  log('fda', scope+'.'+id, !t.checked, t.checked);
  save();
  render();
  return;
}
else return;
save();render()});

document.addEventListener('input', e => {
  const t = e.target, d = t.dataset;
  if (d.k) {
    const v = t.type === 'number' ? +t.value : t.value;
    t.classList.toggle('invalid-input', !validateInput(d.s, d.k, v));
  }
});

document.addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;const a=b.dataset.act,i=+b.dataset.i;
  if(b.dataset.tab){tab=b.dataset.tab;all=false;return render()}
  if(a=='theme'){const r=document.documentElement,d=r.dataset.theme=='dark'||(!r.dataset.theme&&matchMedia('(prefers-color-scheme:dark)').matches);r.dataset.theme=d?'light':'dark';return}
  if(a=='print'||a=='printall'){all=a=='printall';render();setTimeout(()=>{try{print()}catch(x){}all=false;render()},50);return}
  if(a=='pipeadd'){S.pipe.push({n:'New line',f:'Water',Q:10,P:4,L:50});log('piping','add','','line')}
  if(a=='pipedel'){S.pipe.splice(i,1)}
  if(a=='dladd'){S.deadleg.push({n:'New branch',D:25,L:50,ins:0,fluid:'PW',Tloop:80});log('deadleg','add','','branch')}
  if(a=='dldel'){log('deadleg','remove',S.deadleg[i].n,'');S.deadleg.splice(i,1)}
  if(a=='coladd'){S.cold.push({n:'New chamber',T:5,L:5,W:4,H:3,ins:100,prod:500,cp:3,Tin:20,pp:1,acd:12,lw:8,ef:1,df:0});log('cold room','add','','chamber')}
  if(a=='coldel'){S.cold.splice(i,1)}
  if(a=='coldl'){S.loads=S.loads.filter(l=>l.src!='cold');coldRows().forEach(r=>S.loads.push({a:'Cold storage',d:'Refrigeration - '+r.n,kw:Math.round(r.kw*10)/10,ef:1,pf:.85,df:+(+gv('cold','run',18)/24).toFixed(2),c:'E',src:'cold'}));tab='loads'}
  if(a=='addact'){let id='';for(let c=65;c<91;c++){id=String.fromCharCode(c);if(!S.sch.acts.some(z=>z.i==id))break}S.sch.acts.push({i:id,n:'New activity',d:4,p:''});log('schedule','add',id,'')}
  if(a=='delact'){S.sch.acts.splice(i,1)}
  if(a=='estreset'){S.est={q:{},r:{}};log('est','reset','','')}
  if(a=='util'){const x=R.wtr.x;S.loads=S.loads.filter(l=>l.src!='wtr');[['Purified water generator',x.pg,1],['PW loop pump',x.pp,.9],['WFI generator',x.wg,1],['WFI loop pump',x.wp,.9],['Clean steam auxiliaries',x.ca,1]].forEach(r=>S.loads.push({a:'Utilities',d:r[0],kw:Math.round(r[1]*10)/10,ef:r[2],pf:.85,df:.8,c:'E',src:'wtr'}));log('loads','add','','utility loads');tab='loads'}
  if(a=='add'){S.loads.push({a:'',d:'New load',kw:10,ef:.9,pf:.85,df:.8,c:'N'});log('loads','add','','row')}
  if(a=='del'){S.loads.splice(i,1)}
  if(a=='load'){try{S=JSON.parse($('#js').value)}catch(x){alert('Text is not valid project data.');return}}
  if(a=='reset'){if(!confirm('Reset all project data?'))return;S={};try{localStorage.removeItem(K)}catch(x){}location.reload();return}
  if(a=='delc'){S.cust.splice(i,1)}
  if(a=='syncups'){
    S.v.ups = S.v.ups || {};
    S.v.ups.kw = +T.kW_C.toFixed(2);
    log('ups','kw','synced',S.v.ups.kw);
    save(); render();
  }
  if(a=='testc'){
    const ex=$('#ce').value.trim(), v={};
    $('#cv').value.split(',').forEach(p=>{const[k,d]=p.split('=');if(k&&k.trim())v[k.trim()]=+d||0});
    v.V = S.p.V; v.rho = S.p.rho; v.amb = S.p.amb; v.alt = S.p.alt;
    try{
      if(!ex) throw 'Enter an expression';
      const res = ev(ex, v);
      $('#cok').textContent = 'Result: ' + n2(res, 4);
      $('#cerr').textContent = '';
    }catch(x){
      $('#cerr').textContent = 'Error: ' + String(x);
      $('#cok').textContent = '';
    }
  }
  if(a=='addc'){const n=$('#cn').value.trim(),ex=$('#ce').value.trim(),v={};$('#cv').value.split(',').forEach(p=>{const[k,d]=p.split('=');if(k&&k.trim())v[k.trim()]=+d||0});
  try{if(!n||!ex)throw'Enter a name and an expression';ev(ex,v)}catch(x){$('#cerr').textContent=String(x);return}S.cust.push({n,e:ex,v,u:$('#cu').value});log('custom',n,'','created')}
  save();render()});
render();
</script></body></html>
